/* VOICE: un registre comptable sérieux et verrouillé : on y lit vite, on y saisit vite, rien ne s'efface.
   IDEA: le grand livre relié et scellé : lignes fines, colonnes alignées, le chiffre clé surligné au feutre jaune.
   PICTURE: le résultat de l'exercice en grand sur un aplat jaune, la trésorerie par caisse et par devise dessous.
   COLOUR and TYPE: blanc, encre #101418, ardoise, un seul aplat jaune #ffd84a ; nuit #101418. Manrope 800/700/400.
   LAYOUT: application mobile : en-tête fin, une colonne (deux au-delà de 900px), barre d'onglets en bas. */

body.locked nav,body.locked header .hb{display:none}
nav button{background:none;border:0;color:var(--sl);font:600 12px Manrope,sans-serif;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;cursor:pointer;border-radius:0}

const NOW=()=>Date.now();
function recDate(c,r){if(!r)return '';if(c==='slips')return r.mois?lastDay(r.mois):'';return r.date||''}

function balancedLines(ls){if(!Array.isArray(ls)||ls.length<2)return false;let d=0,k=0;for(const l of ls){if(!/^\d{2,8}$/.test(l.c||''))return false;if(!(+l.d>=0&&+l.k>=0))return false;d+=+l.d||0;k+=+l.k||0}return d>0&&Math.abs(d-k)<0.005}

  let q=0;for(const m of moves.filter(m=>m.item===itemId&&!m.del&&m.st!=='X').sort((a,b)=>a.date.localeCompare(b.date)||a.upd-b.upd)){const n=+m.q||0;if(m.type==='E')q+=n;else if(m.type==='S')q-=n;else if(m.type==='I')q=n;if(q<-1e-9)return false}return true;
}
/* Règles d'autorisation : appliquées à la saisie ET à chaque import */
function canWrite(u,c,r,old){
  if(c==='users'&&!old&&!D.users.length&&r.id===r.by&&r.role==='Gérant')return '';
  if(!u||u.del||u.actif===false)return 'auteur inconnu ou retiré';
  if(r.by!==u.id)return 'auteur incohérent';
  if(old&&old.cr!==r.cr)return 'créateur modifié';
  if(!old&&r.cr!==u.id)return 'créateur incohérent';
  const R=u.role,adm=perm('valider',u),own=r.cr===u.id,dt=recDate(c,r),odt=recDate(c,old);
  if(old&&old.del)return 'élément déjà supprimé';
  switch(c){
    case 'users':if(R!=='Gérant')return 'gestion des utilisateurs réservée au gérant';if(!ROLES.includes(r.role)&&!/^r_[A-Za-z0-9_-]{1,40}$/.test(r.role||''))return 'rôle inconnu';break;
    case 'roles':if(R!=='Gérant')return 'gestion des rôles réservée au gérant';if(!/^r_/.test(r.id))return 'rôle invalide';break;
    case 'accounts':case 'acts':if(!adm)return 'réservé au gérant ou au comptable';break;
    case 'emps':if(!perm('paie',u)&&!(perm('rh',u)&&old&&sameExcept(old,r,['photo','posteId'])))return 'droit « paie » requis';break;
    case 'tiers':if(!perm('tiers',u))return 'droit « clients et fournisseurs » requis';if(!adm&&old&&!own)return 'modification réservée à son auteur';break;
    case 'items':if(!perm('stocks',u))return 'droit « stocks » requis';if(!adm&&old&&!own)return 'modification réservée à son auteur';break;
    case 'log':if(old)return 'journal d\'audit intangible';break;
    case 'entries':
      if(old&&old.st==='V')return 'écriture validée intangible (utilisez la contrepassation)';
      if(r.st==='V'&&!adm)return 'validation réservée au gérant ou au comptable';
      if(r.st==='V'&&!r.del&&(!old||old.st!=='V')&&needs2(r)){const ap=approvers(r);if(ap.length<2||!ap.includes(u.id))return 'paiement au-delà du seuil : deux validations de personnes différentes requises'}
      if(!adm&&!own)return 'brouillon d\'un autre utilisateur';
      if(!r.del&&!balancedLines(r.lines))return 'écriture déséquilibrée ou invalide';
      if(lockedFor(dt,r.upd)||(old&&lockedFor(odt,r.upd)))return 'période clôturée';
      break;
    case 'docs':
      if(r.type==='D'){if(!adm&&!own)return 'devis d\'un autre utilisateur';break}
      if(old&&old.st==='E')return 'document émis intangible (utilisez un avoir)';
      if(r.st==='E'&&!adm)return 'émission réservée au gérant ou au comptable';
      if(!adm&&!own)return 'brouillon d\'un autre utilisateur';
      if(r.st==='E'&&lockedFor(dt,r.upd))return 'période clôturée';
      break;
    case 'pays':
      if(!adm)return 'encaissements réservés au gérant ou au comptable';
      if(old){if(!(old.st==='V'&&r.st==='X'&&sameExcept(old,r,['st','rev'])))return 'encaissement intangible'}
      else if(lockedFor(dt,r.upd))return 'période clôturée';
      break;
    case 'slips':
      if(!perm('paie',u))return 'droit « paie » requis';
      if(old){const t=old.st+'>'+r.st;
        if(old.st==='B'){if(lockedFor(dt,r.upd)&&!r.del)return 'période clôturée'}
        else if(t==='V>P'){if(!sameExcept(old,r,['st','paid','payEntry']))return 'bulletin validé intangible'}
        else if(t==='V>X'){if(!sameExcept(old,r,['st','rev']))return 'bulletin validé intangible'}
        else return 'bulletin validé intangible';
        if(old.st!=='B'&&r.del)return 'bulletin validé : annulez-le';}
      else if(r.st!=='B'&&lockedFor(dt,r.upd))return 'période clôturée';
      break;
    case 'moves':
      if(!perm('stocks',u)&&!(r.proj&&r.type==='S'&&(perm('chantiers',u)||perm('atelier',u))))return 'droit « stocks » requis';
      if(old){if(!(old.st==='V'&&r.st==='X'&&sameExcept(old,r,['st','rev'])))return 'mouvement intangible'}
      else if(lockedFor(dt,r.upd))return 'période clôturée';
      if(!adm&&r.entryId)return 'écriture d\'achat réservée au gérant ou au comptable';
      break;
    case 'assets':
      if(!perm('immo',u))return 'droit « immobilisations » requis';
      if(old&&old.st!=='V')return 'immobilisation cédée intangible';
      if(old&&!(r.st==='V'?sameExcept(old,r,['nom','act']):(r.st==='C'&&sameExcept(old,r,['st','cession']))))return 'immobilisation : seuls le nom, l\'activité ou la cession peuvent changer';

const RX={srv:/^https:\/\/[a-z0-9-]{3,40}\.supabase\.co$/,id:/^[A-Za-z0-9_-]{1,64}$/,date:/^\d{4}-\d{2}-\d{2}$/,mois:/^\d{4}-\d{2}$/,code:/^\d{2,8}$/,img:/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/,b64:/^[A-Za-z0-9+/=_-]+$/};
function clean(v,depth=0,key=''){

  if(typeof v==='string')return v.slice(0,(key==='logo'||key==='signature')?600000:2000);
  if(Array.isArray(v))return v.slice(0,500).map(x=>clean(x,depth+1));
  if(typeof v==='object'){const o={};for(const k of Object.keys(v).slice(0,80)){if(k==='__proto__'||k==='constructor'||k==='prototype')continue;o[k]=clean(v[k],depth+1,k)}return o}

}
function validRec(c,r){
  if(!r||typeof r!=='object')return false;
  if(!RX.id.test(r.id||'')||!RX.id.test(r.by||'')||!RX.id.test(r.cr||'')||typeof r.sig!=='string'||!RX.b64.test(r.sig))return false;
  if(!Number.isInteger(r.ver)||typeof r.upd!=='number')return false;
  if(['entries','pays','moves'].includes(c)&&!RX.date.test(r.date||''))return false;
  if(c==='docs'&&!RX.date.test(r.date||''))return false;
  if(c==='slips'&&!RX.mois.test(r.mois||''))return false;
  if((c==='assets'||c==='recs'||c==='farmops'||c==='bandes'||c==='pouops'||c==='chops'||c==='cmds')&&!RX.date.test(r.date||''))return false;
  if((c==='tasks'||c==='projects')&&!(RX.date.test(r.debut||'')&&RX.date.test(r.fin||'')))return false;
  if(c==='cycles'&&!RX.date.test(r.semis||''))return false;
  if(c==='cmds'&&!RX.date.test(r.livr||''))return false;
  if(c==='budgets'&&!(Number.isInteger(r.y)&&Array.isArray(r.prod)&&Array.isArray(r.chg)&&r.prod.length===12&&r.chg.length===12))return false;
  if(c==='objs'&&!Number.isInteger(r.y))return false;
  if(c==='aprs'&&!(RX.id.test(r.e||'')&&typeof r.h==='string'))return false;
  if(c==='pos'&&!(RX.date.test(r.date||'')&&Array.isArray(r.lignes)))return false;
  if(['lots','pisops','stops','rels','pres','prets','mops','invs'].includes(c)&&!RX.date.test(r.date||''))return false;
  if(c==='conges'&&!(RX.date.test(r.du||'')&&RX.date.test(r.au||'')))return false;
  if((c==='journ'||c==='photos')&&!(RX.date.test(r.date||'')&&r.ref&&typeof r.ref.id==='string'))return false;
  if(['gouv','juri','ctrs'].includes(c)&&!(r.x&&typeof r.x.ct==='string'))return false;

async function merge(inc,join){
  const rep={acc:0,same:0,rej:[]};
  const rej=(c,r,why)=>rep.rej.push({c,id:r&&r.id,why,lib:(r&&(r.lib||r.nom||r.num||r.a))||''});
  // 1. utilisateurs : point fixe, chaque version doit être signée par un gérant déjà reconnu
  let pend=(inc.users||[]).map(u=>clean(u)).filter(u=>validRec('users',u)?true:(rej('users',u,'format invalide'),false));
  let changed=true;
  while(changed){changed=false;
    for(const u of pend){if(u._ok)continue;const old=D.users.find(x=>x.id===u.id);
      if(old&&!newer(u,old)){u._ok=1;rep.same++;continue}
      let signer=null,key=null;
      if(join&&u.by===u.id&&u.role==='Gérant'&&!old){signer=u;key=u.keys.find(k=>k.kid===u.kid)}
      else{signer=old&&u.by===u.id?old:D.users.find(x=>x.id===u.by&&!x.del);key=signer&&signer.keys.find(k=>k.kid===u.kid);if(key&&!keyOK(key,u))key=null}
      if(!signer||!key)continue;
      if(signer.role!=='Gérant'||signer.actif===false)continue;
      if(!await verifySig(u,key)){u._ok=1;rej('users',u,'signature invalide');continue}
      delete u._ok;const i=D.users.findIndex(x=>x.id===u.id);if(i<0)D.users.push(u);else D.users[i]=u;rep.acc++;changed=true;u._ok=1;
      if(join)rep.root=rep.root||(u.role==='Gérant'&&u.by===u.id?u:null);}
  }
  for(const u of pend)if(!u._ok)rej('users',u,'non signé par un gérant reconnu');
  for(const u of D.users)delete u._ok;
  // 2. réglages
  if(inc.settings){const s=clean(inc.settings);const old=D.settings;
    if(!old||newer(s,old)){const u=D.users.find(x=>x.id===s.by),k0=u&&u.keys.find(k=>k.kid===s.kid),k=keyOK(k0,s)?k0:null;
      const err=!k?'auteur inconnu':!await verifySig(s,k)?'signature invalide':(s.logo&&!RX.img.test(s.logo))||(s.signature&&!RX.img.test(s.signature))?'image invalide':(s.lock&&!RX.date.test(s.lock))?'date de clôture invalide':(s.syncUrl&&!RX.srv.test(s.syncUrl))?'adresse serveur invalide':canWriteSettings(u,s,old);
      if(err)rej('settings',s,err);else{D.settings=s;rep.acc++}}}
  if(!D.settings)throw new Error('Fichier sans réglages valides');
  // 3. autres collections
  for(const c of COLL.slice(1)){
    for(const raw of inc[c]||[]){const r=clean(raw);
      if(!validRec(c,r)){rej(c,r,'format invalide');continue}
      const old=D[c].find(x=>x.id===r.id);
      if(old&&!newer(r,old)){rep.same++;continue}
      const u=D.users.find(x=>x.id===r.by),k=u&&u.keys.find(k=>k.kid===r.kid);
      if(!k){rej(c,r,'auteur ou clé inconnus');continue}
      if(!keyOK(k,r)){rej(c,r,'appareil révoqué');continue}
      if(!await verifySig(r,k)){rej(c,r,'signature invalide : fichier modifié');continue}
      const err=canWrite(u,c,r,old?JSON.parse(JSON.stringify(old)):null);
      if(err){rej(c,r,err);continue}
      if(c==='moves'&&!stockOK(r.item,[...D.moves.filter(m=>m.id!==r.id),r])){rej(c,r,'stock négatif');continue}
      if(old&&old.ver===r.ver)rep.conf=(rep.conf||0)+1;
      const i=D[c].findIndex(x=>x.id===r.id);if(i<0)D[c].push(r);else D[c][i]=r;rep.acc++;}
  }
  VER++;return rep;
}

/* ============ NOMBRE EN LETTRES ============ */
function lettres(n){
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const c99=n=>{if(n<20)return u[n];let t=Math.floor(n/10),r=n%10;if(t===7||t===9)r+=10;if(t===8&&r===0)return 'quatre-vingts';if(r===0)return d[t];if((r===1||r===11)&&t<8)return d[t]+' et '+u[r];return d[t]+'-'+u[r]};
  const c999=n=>{const c=Math.floor(n/100),r=n%100;let s='';if(c>1)s=u[c]+' cent'+(r===0?'s':'');else if(c===1)s='cent';if(r)s+=(s?' ':'')+c99(r);return s};
  if(n===0)return 'zéro';const parts=[];
  for(const [v,nm] of [[1e9,'milliard'],[1e6,'million'],[1e3,'mille']]){const q=Math.floor(n/v);if(q){if(v===1e3)parts.push(q===1?'mille':c999(q).replace(/(cent|vingt)s$/,'$1')+' mille');else parts.push(c999(q)+' '+nm+(q>1?'s':''));n%=v}}
  if(n)parts.push(c999(n));return parts.join(' ');
}
function montantLettres(x,cur){x=r2(x);const e=Math.floor(x),c=Math.round((x-e)*100);const dv=cur==='CDF'?['franc congolais','francs congolais','centime']:['dollar américain','dollars américains','cent'];let s=lettres(e)+' '+(e>1?dv[1]:dv[0]);if(c)s+=' et '+lettres(c)+' '+dv[2]+(c>1?'s':'');return s.charAt(0).toUpperCase()+s.slice(1)}

function buildQuick(k,f){
  const q=QUICK[k],cur=f.cur,rate=+f.rate||RATE(),mt=r2(f.mt);if(!(mt>0))throw new Error('Montant invalide');
  const rt=f.tva?(+D.settings.tva||0)/100:0,ht=r2(mt/(1+rt)),mtB=toBase(mt,cur,rate),htB=toBase(ht,cur,rate),tvaB=r2(mtB-htB);
  const t=f.tiers||'';if(q.tiers&&(!t||t==='__new'))throw new Error('Choisissez le '+(q.tiers==='C'?'client':'fournisseur'));
  const Tl=(c,side,a,ac)=>{const x={c,d:0,k:0,t:''};x[side]=a;x.fx={cur:TR(c)[2],a:ac};return x};
  const Dl=(c,v,tt)=>({c,d:r2(v),k:0,t:tt||''}),Kl=(c,v,tt)=>({c,d:0,k:r2(v),t:tt||''});
  if(f.tr&&TR(f.tr)[2]!==cur)throw new Error('Le compte de trésorerie doit être dans la devise choisie');
  let L=[],jr='OD';const trJ=c=>TR(c)[3];
  switch(k){
    case 'vente':L=[Tl(f.tr,'d',mtB,mt),Kl(f.acc,htB)];if(tvaB)L.push(Kl('4431',tvaB));jr=trJ(f.tr);break;
    case 'depense':L=[Dl(f.acc,htB)];if(tvaB)L.push(Dl('4451',tvaB));L.push(Tl(f.tr,'k',mtB,mt));jr=trJ(f.tr);break;
    case 'achatcredit':L=[Dl(f.acc,htB)];if(tvaB)L.push(Dl('4451',tvaB));L.push(Kl('401',mtB,t));jr='AC';break;
    case 'ventecredit':L=[Dl('411',mtB,t),Kl(f.acc,htB)];if(tvaB)L.push(Kl('4431',tvaB));jr='VE';break;
    case 'payfour':L=[Dl('401',mtB,t),Tl(f.tr,'k',mtB,mt)];jr=trJ(f.tr);break;
    case 'enccli':L=[Tl(f.tr,'d',mtB,mt),Kl('411',mtB,t)];jr=trJ(f.tr);break;
    case 'apport':case 'emprunt':L=[Tl(f.tr,'d',mtB,mt),Kl(f.acc,mtB)];jr=trJ(f.tr);break;
    case 'rembours':{const i=r2(Math.min(+f.int||0,mt)),iB=toBase(i,cur,rate);L=[Dl(f.acc,r2(mtB-iB))];if(iB)L.push(Dl('671',iB));L.push(Tl(f.tr,'k',mtB,mt));jr=trJ(f.tr);break}
    case 'transfert':{if(f.tr2===f.tr)throw new Error('Choisissez deux comptes différents');const c2=TR(f.tr2)[2],mt2=r2(f.mt2);if(!(mt2>0))throw new Error('Montant reçu invalide');
      const b1=mtB,b2=toBase(mt2,c2,rate),diff=r2(b1-b2);L=[Tl(f.tr2,'d',b2,mt2),Tl(f.tr,'k',b1,mt)];if(diff>0)L.push(Dl('676',diff));if(diff<0)L.push(Kl('776',-diff));jr=trJ(f.tr);break}
  }
  L=L.filter(l=>l.d||l.k);const sd=r2(L.reduce((s,l)=>s+l.d,0)),sk=r2(L.reduce((s,l)=>s+l.k,0));
  if(Math.abs(sd-sk)>0.004){const fix=L.find(l=>!isTreso(l.c)&&(l.d||l.k));if(fix){if(fix.d)fix.d=r2(fix.d+(sk-sd));else fix.k=r2(fix.k+(sd-sk))}}
  return {lines:L,jr};
}

function stockOf(it,end){
  return memo('st'+it.id+(end||''),()=>{let q=0,v=0;
  for(const m of live(D.moves).filter(m=>m.item===it.id&&m.st!=='X'&&(!end||m.date<=end)).sort((a,b)=>a.date.localeCompare(b.date)||a.upd-b.upd)){const n=+m.q||0;
    if(m.type==='E'){v+=n*(+m.pu||0);q+=n}else if(m.type==='S'){const c=q>0?v/q:0;v-=c*n;q-=n}else if(m.type==='I'){if(q>0)v=v/q*n;else v=n*(+m.pu||0);q=n}}
  return {q:Math.round(q*1000)/1000,v:r2(v),cmup:q>0?v/q:0}});
}

  const y=EX(),end=y+'-12-31';if(locked(end))throw new Error('Exercice clôturé');
  const old=posted().find(e=>e.src&&e.src.type==='variation'&&e.src.ref==y&&!isReversed(e.id));
  if(old)await reverse(old.id,'recalcul');
  const cats={};for(const i of live(D.items))cats[i.cat]=r2((cats[i.cat]||0)+stockOf(i,end).v);
  const m=bTo(end),lines=[];
  for(const c of Object.keys(STK)){const diff=r2((cats[c]||0)-solde(m,[c]));if(Math.abs(diff)<0.005)continue;const v=STK[c].v;
    if(diff>0)lines.push({c,d:diff,k:0,t:''},{c:v,d:0,k:diff,t:''});else lines.push({c:v,d:-diff,k:0,t:''},{c,d:0,k:-diff,t:''})}
  if(!lines.length){toast('Aucune variation à comptabiliser');return}
  await commit('entries',{id:uid(),date:end,jr:'OD',piece:'INV-'+y,lib:'Variation des stocks — inventaire '+y,act:live(D.acts).at(-1)?.id||'act5',src:{type:'variation',ref:y},st:'V',lines},'variation des stocks',String(y));
  toast('Écriture de variation enregistrée au 31/12/'+y);
}

function slipCalc(s){
  const tx=s.tx||{cs:D.settings.cnssSal,cp:D.settings.cnssPat,inpp:D.settings.inpp,onem:D.settings.onem};const bi=r2((+s.base||0)+(+s.primes||0));
  const o={bi,cnssS:r2(bi*tx.cs/100),cnssP:r2(bi*tx.cp/100),inpp:r2(bi*tx.inpp/100),onem:r2(bi*tx.onem/100),ipr:r2(s.ipr),av:r2(s.avance),ind:r2(s.indem)};
  o.net=r2(bi+o.ind-o.cnssS-o.ipr-o.av);o.brut=r2(bi+o.ind);o.patr=r2(o.cnssP+o.inpp+o.onem);o.cout=r2(o.brut+o.patr);return o;
}
async function postSlip(s){
  const c=slipCalc(s),emp=byId('emps',s.emp)||{},b=x=>toBase(x,s.cur,s.rate);
  const L=[{c:'661',d:b(c.bi),k:0},{c:'663',d:b(c.ind),k:0},{c:'431',d:0,k:b(c.cnssS)},{c:'447',d:0,k:b(c.ipr)},{c:'421',d:0,k:b(c.av)},{c:'422',d:0,k:b(c.net)},{c:'664',d:b(c.patr),k:0},{c:'431',d:0,k:b(c.cnssP)},{c:'433',d:0,k:b(r2(c.inpp+c.onem))}].filter(l=>l.d||l.k).map(l=>({...l,t:''}));
  const sd=r2(L.reduce((s,l)=>s+l.d,0)),sk=r2(L.reduce((s,l)=>s+l.k,0));if(Math.abs(sd-sk)>0.004){const n=L.find(l=>l.c==='422');n.k=r2(n.k+sd-sk)}
  const [yy,mm]=s.mois.split('-');
  const e={id:uid(),date:lastDay(s.mois),jr:'PA',piece:'PAIE-'+s.mois,lib:`Salaire ${MOISL[+mm-1]} ${yy} — ${emp.nom||''}`,act:emp.act||'act5',src:{type:'paie',ref:s.id},st:'V',lines:L};
  await commit('entries',e,'comptabilisation paie',e.lib);return e.id;
}

function imgToData(file,max,cb){if(!/^image\/(png|jpeg)$/.test(file.type))return toast('Image PNG ou JPEG uniquement');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)}
async function closePeriod(m){
  const until=lastDay(m);
  const drafts=live(D.entries).filter(e=>e.st==='B'&&e.date<=until).length+live(D.docs).filter(d=>d.type!=='D'&&d.st==='B'&&d.date<=until).length+live(D.slips).filter(s=>s.st==='B'&&lastDay(s.mois)<=until).length;
  if(drafts)throw new Error(drafts+' brouillon(s) dans la période : validez-les ou supprimez-les d\'abord');
  const tot=Object.values(bTo(until)).reduce((s,b)=>[s[0]+b.d,s[1]+b.k],[0,0]);if(Math.abs(tot[0]-tot[1])>0.01)throw new Error('Balance déséquilibrée : clôture impossible');
  const hash=await sha(canon(balRowsTo(until)));
  const s=JSON.parse(JSON.stringify(D.settings));s.lock=until;s.closings=[...(s.closings||[]),{until,at:NOW(),by:ME,hash}];
  await commitSettings(s,'clôture','jusqu\'au '+until);

  if(o.type==='R'&&!(o.qte>0))throw new Error('Indiquez la quantité récoltée');
  if(o.type==='V'&&!(o.montant>0))throw new Error('Indiquez le montant de la vente');
  const c=byId('cycles',o.cycle);
  if(F.pay&&o.type!=='R'){const amt=o.type==='V'?o.montant:o.cout;if(!(amt>0))throw new Error('Montant nul : rien à comptabiliser');
    const acc=o.type==='V'?'702':FOPACC[o.type],cur=TR(F.pay)[2],lib=(o.type==='V'?'Vente ':'')+(o.lib||FOPS[o.type])+' — '+c.culture;
    const lines=o.type==='V'?[{c:F.pay,d:amt,k:0,t:'',fx:{cur,a:amt}},{c:acc,d:0,k:amt,t:''}]:[{c:acc,d:amt,k:0,t:''},{c:F.pay,d:0,k:amt,t:'',fx:{cur,a:amt}}];
    const e={id:uid(),date:o.date,jr:TR(F.pay)[3],piece:'FERME',lib:lib.slice(0,200),act:farmAct(),lines,src:{type:'ferme',ref:o.id},st:isAdmin()?'V':'B'};
    await commit('entries',e,e.st==='V'?'saisie validée':'brouillon',e.lib);o.entryId=e.id}
  await commit('farmops',o,'opération ferme',FOPS[o.type]+' '+(o.lib||''));closeSheet();render();cycleView(o.cycle);toast('Opération enregistrée');
}

/* ============ ACTIVITÉS : POULETS DE CHAIR ============ */
const POPS={M:'Mortalité',A:'Aliment',S:'Soins, vaccins',P:'Pesée',D:'Autre dépense',V:'Vente'};
const POPACC={A:'602',S:'604',D:'638'};
const BSTAT=['En élevage','En vente','Clôturée'];
/* Poids vif moyen indicatif d'un poulet de chair (kg) selon l'âge en jours — repère de type Cobb/Ross, à adapter */
const STDW=[[0,0.04],[7,0.18],[14,0.45],[21,0.9],[28,1.45],[35,2.05],[42,2.65],[49,3.2]];
const stdAt=d=>{for(let i=1;i<STDW.length;i++){const [a,x]=STDW[i-1],[b,y]=STDW[i];if(d<=b)return x+(y-x)*(d-a)/(b-a)}return STDW.at(-1)[1]};
function pouAct(){return (live(D.acts).find(a=>/poulet|volaille|élevage/i.test(a.nom))||live(D.acts)[0]||{}).id}
function bandeStats(b){
  const ops=live(D.pouops).filter(o=>o.bande===b.id).sort((x,y)=>x.date.localeCompare(y.date));
  let mort=0,vendus=0,kgv=0,ca=0,alim=0,calim=0,soins=0,autres=0,pw=null,pd='';const pes=[],byDay={};
  for(const o of ops){if(o.type==='M'){mort+=+o.qte||0;byDay[o.date]=(byDay[o.date]||0)+(+o.qte||0)}else if(o.type==='V'){vendus+=+o.qte||0;kgv+=+o.kg||0;ca+=+o.montant||0}else if(o.type==='A'){alim+=+o.kg||0;calim+=+o.cout||0}else if(o.type==='S')soins+=+o.cout||0;else if(o.type==='D')autres+=+o.cout||0;else if(o.type==='P'){pw=+o.kg||0;pd=o.date;pes.push([dd(b.date,o.date),pw])}}
  const init=+b.nb||0,eff=Math.max(0,init-mort-vendus),age=dd(b.date,b.statut==='Clôturée'&&b.fin?b.fin:today());
  const cPous=r2(init*(+b.pu||0)),cost=r2(cPous+calim+soins+autres),bio=pw?eff*pw:0,prod=kgv+bio;
  const ic=prod>0?alim/prod:0,lastM=Object.entries(byDay).sort().at(-1);
  return {ops,init,mort,vendus,eff,age,kgv,ca:r2(ca),alim,calim:r2(calim),soins:r2(soins),autres:r2(autres),cPous,cost,pw,pd,pes,bio,ic,
    tm:init?mort/init*100:0,ckg:kgv?cost/kgv:0,pmoy:kgv?ca/kgv:0,marge:r2(ca-cost),byDay,lastM,std:stdAt(Math.max(0,age))};
}

async function savePop(type,F){
  const o={id:uid(),bande:F.bande,type,date:F.date,lib:(F.lib||'').slice(0,120),qte:Math.max(0,Math.round(+F.qte||0)),kg:Math.max(0,+F.kg||0),cout:r2(Math.max(0,+F.cout||0)),montant:0};
  const b=byId('bandes',o.bande),s=bandeStats(b);
  if((type==='M'||type==='V')&&!(o.qte>0))throw new Error('Nombre de sujets invalide');

  if(type==='V'){o.montant=r2(+F.montant||(+F.pk||0)*o.kg);if(!(o.montant>0))throw new Error('Indiquez le prix au kilo ou le montant')}
  if((type==='S'||type==='D')&&!(o.cout>0))throw new Error('Indiquez le coût');
  const amt=type==='V'?o.montant:o.cout;
  if(F.pay&&amt>0){const acc=type==='V'?'702':POPACC[type],cur=TR(F.pay)[2],lib=(type==='V'?'Vente poulets ':POPS[type]+' ')+b.nom+(o.lib?' — '+o.lib:'');
    const lines=type==='V'?[{c:F.pay,d:amt,k:0,t:'',fx:{cur,a:amt}},{c:acc,d:0,k:amt,t:''}]:[{c:acc,d:amt,k:0,t:''},{c:F.pay,d:0,k:amt,t:'',fx:{cur,a:amt}}];
    const e={id:uid(),date:o.date,jr:TR(F.pay)[3],piece:'ELEV',lib:lib.slice(0,200),act:pouAct(),lines,src:{type:'poulets',ref:o.id},st:isAdmin()?'V':'B'};
    await commit('entries',e,e.st==='V'?'saisie validée':'brouillon',e.lib);o.entryId=e.id}
  await commit('pouops',o,'élevage',POPS[type]+' '+b.nom);
  const s2=bandeStats(b);if(s2.eff===0&&b.statut!=='Clôturée'){const c=JSON.parse(JSON.stringify(b));c.statut='Clôturée';c.fin=o.date;await commit('bandes',c,'bande clôturée',b.nom)}

}

/* ============ DIRECTION : TABLEAU DE BORD, BUDGETS, OBJECTIFS, RAPPORTS ============ */
const PRD=['7','82','84','86','88'],CHG=['6','81','83','85','87','89'];
const OBJM={ca:'Chiffre d\'affaires',res:'Résultat',mg:'Taux de marge (%)',tre:'Trésorerie totale',man:'Indicateur suivi à la main'};
function addMonths(mo,n){let [y,m]=mo.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')}
function monthsBetween(a,b){const r=[];let x=a;while(x<=b&&r.length<240){r.push(x);x=addMonths(x,1)}return r}
function kf(v){const a=Math.abs(v),s=v<0?'−':'';return a>=1e9?s+(a/1e9).toFixed(1).replace('.',',')+' Md':a>=1e6?s+(a/1e6).toFixed(1).replace('.',',')+' M':a>=1e3?s+Math.round(a/1e3)+' k':s+Math.round(a)}
function periode(){const t=sub.tp||'ytd',mo=/^\d{4}-\d{2}$/.test(sub.tm||'')?sub.tm:today().slice(0,7);let a,b;
  if(t==='m'){a=mo;b=mo}else if(t==='q'){const q=Math.floor((+mo.slice(5)-1)/3);a=mo.slice(0,4)+'-'+String(q*3+1).padStart(2,'0');b=addMonths(a,2)}else if(t==='y'){a=mo.slice(0,4)+'-01';b=mo.slice(0,4)+'-12'}else{a=mo.slice(0,4)+'-01';b=mo}
  return {t,mo,a,b,from:a+'-01',to:lastDay(b),ms:monthsBetween(a,b)}}
function cmpPer(P,c){if(c==='n1'){const a=(+P.a.slice(0,4)-1)+P.a.slice(4),b=(+P.b.slice(0,4)-1)+P.b.slice(4);return {a,b,from:a+'-01',to:lastDay(b),ms:monthsBetween(a,b)}}
  const n=P.ms.length,b=addMonths(P.a,-1),a=addMonths(P.a,-n);return {a,b,from:a+'-01',to:lastDay(b),ms:monthsBetween(a,b)}}
function perBal(from,to,act){return balances('pb'+from+to+(act||''),e=>e.date>=from&&e.date<=to&&(!act||e.act===act))}
function perKpi(from,to,act){const m=perBal(from,to,act),p=solde(m,PRD,'C'),c=solde(m,CHG,'D');return {p,c,r:r2(p-c),mg:p?(p-c)/p*100:0}}
function budPer(ms,act){let p=0,c=0;for(const mo of ms){const y=+mo.slice(0,4),i=+mo.slice(5)-1;for(const b of live(D.budgets))if(b.y===y&&(!act||b.act===act)){p+=+(b.prod||[])[i]||0;c+=+(b.chg||[])[i]||0}}return {p:r2(p),c:r2(c),r:r2(p-c),any:live(D.budgets).some(b=>ms.some(m=>+m.slice(0,4)===b.y))}}
function tresoTot(to){const fx=tresoFx(to);return r2(TRESO.reduce((s,[c,,cur])=>s+toBase(fx[c]||0,cur),0))}
function tiersSoldes(to,pre,sens){const m={};for(const e of posted()){if(e.date>to)continue;for(const l of e.lines)if(l.c.startsWith(pre)){const k=l.t||'';m[k]=(m[k]||0)+(sens==='D'?(+l.d||0)-(+l.k||0):(+l.k||0)-(+l.d||0))}}return Object.entries(m).map(([t,v])=>[t,r2(v)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1])}
/* Graphique mensuel : produits, charges et repère budget ; barres cliquables dans l'app */
function chartSVG(data,print){
  const w=print?640:420,h=print?230:240,pl=print?46:40,pb=26,pt=12,n=data.length,gw=(w-pl-8)/n,mx=Math.max(1,...data.flatMap(d=>[d.p,d.c,d.b||0]));
  const Y=v=>pt+(h-pt-pb)*(1-v/mx),ink=print?'#101418':'var(--ac)',sl=print?'#9aa6b0':'var(--sl)',gr=print?'#ddd':'var(--ln)',tx=print?'#333':'var(--sl)';
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Produits et charges par mois">`;
  for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);s+=`<line x1="${pl}" x2="${w-4}" y1="${y}" y2="${y}" stroke="${gr}" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${tx}">${kf(v)}</text>`}
  data.forEach((d,i)=>{const x=pl+i*gw,bw=Math.max(3,gw*0.32),g=print?'':` data-act="tdbM" data-v="${d.mo}" style="cursor:pointer"`;
    s+=`<g${g}><rect x="${x}" y="${pt}" width="${gw}" height="${h-pt-pb}" fill="transparent"/><rect x="${x+gw*0.14}" y="${Y(d.p)}" width="${bw}" height="${Math.max(0,h-pb-Y(d.p))}" fill="${ink}" rx="2"/><rect x="${x+gw*0.14+bw+2}" y="${Y(d.c)}" width="${bw}" height="${Math.max(0,h-pb-Y(d.c))}" fill="${sl}" opacity=".6" rx="2"/>`;
    if(d.b)s+=`<line x1="${x+gw*0.08}" x2="${x+gw*0.92}" y1="${Y(d.b)}" y2="${Y(d.b)}" stroke="#e0a800" stroke-width="3"/>`;
    s+=`<text x="${x+gw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="${d.on?ink:tx}" font-weight="${d.on?800:400}">${d.l}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:${ink}"></i>Produits</span><span><i style="background:${sl};opacity:.6"></i>Charges</span><span><i style="background:#e0a800"></i>Budget des produits</span></div>`}
function direction(){

function tdbView(){

/* ============ PAIE : BARÈME IPR ============ */
/* Barème annuel de l'IPR (RDC), appliqué au douzième ; impôt plafonné à 30 % du revenu imposable ; réduction pour charges de famille réglable. */
const IPRB=[[1944000,3],[21600000,15],[43200000,30],[Infinity,40]];
function iprCalc(bi,cnssS,cur,pac){const rate=cur==='USD'?RATE():1,base=Math.max(0,(bi-cnssS)*rate);let t=0,prev=0;
  for(const [lim,tx] of IPRB){const m=lim/12;if(base>prev){t+=(Math.min(base,m)-prev)*tx/100}prev=m;if(base<=m)break}
  const fam=Math.min(+pac||0,+(D.settings.iprFamMax??9))*(+(D.settings.iprFam??2))/100;t=t*(1-Math.min(1,fam));t=Math.min(t,base*0.30);
  return r2(t/rate)}

function lotStats(l){const ops=live(D.pisops).filter(o=>o.lot===l.id).sort((a,b)=>a.date.localeCompare(b.date));let mort=0,nr=0,kgr=0,ca=0,alim=0,ca_=0,dep=0,pm=+l.pmi||0,pd=l.date;const pes=[[0,pm]],byDay={};
  for(const o of ops){if(o.type==='M'){mort+=+o.qte||0;byDay[o.date]=(byDay[o.date]||0)+(+o.qte||0)}else if(o.type==='R'){nr+=+o.qte||0;kgr+=+o.kg||0;ca+=+o.montant||0}else if(o.type==='A'){alim+=+o.kg||0;ca_+=+o.cout||0}else if(o.type==='D')dep+=+o.cout||0;else if(o.type==='P'){pm=+o.g||0;pd=o.date;pes.push([dd(l.date,o.date),pm])}}
  const init=+l.nb||0,eff=Math.max(0,init-mort-nr),age=dd(l.date,l.statut==='Clôturé'&&l.fin?l.fin:today()),bio=eff*pm/1000,gain=Math.max(0,bio+kgr-init*(+l.pmi||0)/1000);
  const cost=r2(init*(+l.pu||0)+ca_+dep),lastM=Object.entries(byDay).sort().at(-1);
  return {ops,init,mort,nr,kgr,ca:r2(ca),alim,calim:r2(ca_),dep:r2(dep),eff,age,pm,pd,pes,bio,gain,ic:gain>0?alim/gain:0,surv:init?(init-mort)/init*100:0,cost,ckg:(kgr+bio)>0?cost/(kgr+bio):0,marge:r2(ca-cost),lastM,dens:+l.surface?eff/+l.surface:0}}

function depNom(id){return id?((byId('deps',id)||{}).nom||'Dépôt supprimé'):'Dépôt principal'}
function depList(){return [{id:'',nom:'Dépôt principal'},...live(D.deps)]}
function depQ(it,dep,end){return memo('dq'+it.id+'|'+(dep||'')+'|'+(end||''),()=>{const m={};let g=0;
  for(const mv of live(D.moves).filter(x=>x.item===it.id&&x.st!=='X'&&(!end||x.date<=end)).sort((a,b)=>a.date.localeCompare(b.date)||a.upd-b.upd)){const n=+mv.q||0,d=mv.dep||'';
    if(mv.type==='E'){m[d]=(m[d]||0)+n;g+=n}else if(mv.type==='S'){m[d]=(m[d]||0)-n;g-=n}else if(mv.type==='I'){m[d]=(m[d]||0)+(n-g);g=n}else if(mv.type==='T'){m[d]=(m[d]||0)-n;m[mv.dep2||'']=(m[mv.dep2||'']||0)+n}}
  return Math.round((m[dep||'']||0)*1000)/1000})}
function depSelect(name,val,label){return D.deps&&live(D.deps).length?`<label class="f">${label||'Dépôt'}<select name="${name}">${depList().map(d=>`<option value="${esc(d.id)}" ${d.id===(val||'')?'selected':''}>${esc(d.nom)}</option>`).join('')}</select></label>`:''}
function depView(){const its=live(D.items).filter(i=>i.actif!==false).sort((a,b)=>a.nom.localeCompare(b.nom)),ds=depList(),can=perm('stocks');
  return `<div class="btns">${can?'<button data-act="depForm">+ Dépôt</button>':''}${can&&ds.length>1&&its.length?'<button class="pr" data-act="trForm">Transférer entre dépôts</button>':''}</div>
  ${ds.length<2?'<p class="muted">Créez un dépôt par lieu de stockage (ferme, atelier, magasin de chantier, boutique). Les entrées, sorties et inventaires se font alors par dépôt, et les transferts suivent le matériel d\'un lieu à l\'autre.</p>':''}
  <div class="scroll"><table><thead><tr><th>Article</th>${ds.map(d=>`<th class="n">${esc(d.nom)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${its.map(i=>`<tr><td><b>${esc(i.nom)}</b><br><span class="small muted">${esc(i.unite)}</span></td>${ds.map(d=>{const q=depQ(i,d.id);return `<td class="n ${q<0?'neg':''}">${q?fmtQ(q):''}</td>`}).join('')}<td class="n"><b>${fmtQ(stockOf(i).q)}</b></td></tr>`).join('')}</tbody></table></div>
  ${live(D.deps).length?`<h3>Dépôts</h3>${live(D.deps).map(d=>`<div class="card"><b>${esc(d.nom)}</b><div class="small muted">${esc(d.lieu||'')}${d.resp?' · responsable '+esc(userNom(d.resp)):''}</div></div>`).join('')}`:''}`}
function depForm(){openSheet(`<h2>Nouveau dépôt</h2><form id="fdep"><label class="f">Nom<input name="nom" required maxlength="60" placeholder="Magasin de la ferme"></label><label class="f">Lieu<input name="lieu" maxlength="120"></label><label class="f">Responsable<select name="resp">${optUsers(ME)}</select></label>
  <div class="btns"><button class="pr" type="submit">Enregistrer</button><button type="button" class="ghost" data-act="close">Annuler</button></div></form>`)}
function trForm(){const its=live(D.items).filter(i=>i.actif!==false&&stockOf(i).q>0);
  openSheet(`<h2>Transfert entre dépôts</h2><form id="ftr"><label class="f">Article<select name="item">${its.map(i=>`<option value="${esc(i.id)}">${esc(i.nom)}</option>`).join('')}</select></label>
  <div class="row2">${depSelect('dep','','De')}${depSelect('dep2',live(D.deps)[0]?.id,'Vers')}</div>
  <div class="row2"><label class="f">Quantité<input type="number" name="q" step="any" min="0" required></label><label class="f">Date<input type="date" name="date" value="${today()}" required></label></div>
  <label class="f">Note (transporteur, bon…)<input name="motif" maxlength="120"></label>
  <div class="btns"><button class="pr" type="submit">Transférer</button><button type="button" class="ghost" data-act="close">Annuler</button></div></form>`)}
function invsView(){const vs=live(D.invs).sort((a,b)=>b.date.localeCompare(a.date)),can=perm('stocks');
  return `<p class="muted">L'inventaire physique compare le stock compté au stock théorique de l'app, article par article. Les écarts sont justifiés puis passés en stock à la validation.</p>
  ${can?`<div class="btns"><button class="pr" data-act="invNew">+ Nouvel inventaire</button></div>`:''}
  ${vs.map(v=>{const s=invStats(v);return `<div class="card" data-act="invOpen" data-id="${esc(v.id)}" style="cursor:pointer"><div class="top"><span><b>${esc(v.num)}</b> · ${esc(depNom(v.dep))} · ${dfr(v.date)}</span><span class="tag ${v.statut==='Validé'?'g':'y'}">${esc(v.statut)}</span></div><div class="small muted">${s.compte}/${v.lignes.length} articles comptés · écart ${money(s.ev)}</div></div>`}).join('')||''}`}
function invStats(v){let compte=0,ev=0,vt=0,vp=0;for(const l of v.lignes){const r=invRet(l);if(r!==null)compte++;const it=byId('items',l.item)||{},c=+l.cmup||0;vt+=l.theo*c;if(r!==null){vp+=r*c;ev+=(r-l.theo)*c}else vp+=l.theo*c}return {compte,ev:r2(ev),vt:r2(vt),vp:r2(vp)}}
function invRet(l){return l.c2!==''&&l.c2!=null?+l.c2:l.c1!==''&&l.c1!=null?+l.c1:null}
async function invNew(){const dep=live(D.deps).length?(window.prompt('Dépôt à inventorier ? Tapez son nom, ou laissez vide pour le dépôt principal.\n'+depList().map(d=>'• '+d.nom).join('\n'))||'').trim():'';const dd_=depList().find(d=>d.nom.toLowerCase()===dep.toLowerCase())||depList()[0];
  const date=today(),its=live(D.items).filter(i=>i.actif!==false).sort((a,b)=>a.nom.localeCompare(b.nom));let n=live(D.invs).filter(v=>v.date.slice(0,4)===date.slice(0,4)).length+1;
  const v={id:uid(),num:'INV-'+date.slice(0,4)+'-'+LOC.code+String(n).padStart(3,'0'),date,dep:dd_.id,statut:'Ouvert',lignes:its.map(i=>({item:i.id,theo:depQ(i,dd_.id,date),cmup:r2(stockOf(i,date).cmup),c1:'',c2:'',just:''}))};
  await commit('invs',v,'ouverture inventaire',v.num);invView(v.id)}
function invView(id){const v=byId('invs',id),s=invStats(v),open=v.statut==='Ouvert'&&perm('stocks');
  openSheet(`<h2>${esc(v.num)} <span class="tag ${v.statut==='Validé'?'g':'y'}">${esc(v.statut)}</span></h2><p class="small muted">${esc(depNom(v.dep))} · stock théorique au ${dfr(v.date)} · valeur théorique ${money(s.vt)} · physique ${money(s.vp)} · <b class="${s.ev<0?'neg':''}">écart ${money(s.ev)}</b></p>
  <form id="finv2" data-id="${esc(id)}"><div class="scroll"><table><thead><tr><th>Article</th><th class="n">Théorique</th><th>1er comptage</th><th>2e comptage</th><th class="n">Écart</th><th>Justification</th></tr></thead><tbody>${v.lignes.map((l,i)=>{const it=byId('items',l.item)||{},r=invRet(l),e=r===null?null:r2(r-l.theo);return `<tr><td>${esc(it.nom||'?')}<br><span class="small muted">${esc(it.unite||'')} · ${fmt(l.cmup)}</span></td><td class="n">${fmtQ(l.theo)}</td><td><input type="number" name="c1_${i}" step="any" min="0" value="${esc(l.c1)}" style="width:72px" ${open?'':'disabled'}></td><td><input type="number" name="c2_${i}" step="any" min="0" value="${esc(l.c2)}" style="width:72px" ${open?'':'disabled'}></td><td class="n ${e?'neg':''}">${e===null?'—':(e>0?'+':'')+fmtQ(e)}</td><td><input name="j_${i}" value="${esc(l.just)}" maxlength="80" style="min-width:110px" ${open?'':'disabled'} placeholder="${e?'casse, vol, erreur…':''}"></td></tr>`}).join('')}</tbody></table></div>
  <p class="small muted">Le 2e comptage, s'il est saisi, remplace le 1er (contre-comptage des écarts). Les articles non comptés gardent leur stock théorique.</p>
  <div class="btns">${open?'<button class="pr" type="submit">Enregistrer les comptages</button>':''}${open&&isAdmin()?`<button type="button" data-act="invValid" data-id="${esc(id)}">Valider et passer les écarts</button>`:''}<button type="button" class="ghost" data-act="invPrint" data-id="${esc(id)}">Procès-verbal (PDF)</button><button type="button" class="ghost" data-act="close">Fermer</button></div></form>`)}
async function saveInv2(f,F){const v=JSON.parse(JSON.stringify(byId('invs',f.dataset.id)));v.lignes.forEach((l,i)=>{l.c1=F['c1_'+i]===''?'':String(Math.max(0,+F['c1_'+i]));l.c2=F['c2_'+i]===''?'':String(Math.max(0,+F['c2_'+i]));l.just=(F['j_'+i]||'').slice(0,80)});

async function invValid(id){const v=JSON.parse(JSON.stringify(byId('invs',id)));const ec=v.lignes.filter(l=>{const r=invRet(l);return r!==null&&Math.abs(r-l.theo)>0.0005});

  for(const l of ec){const r=invRet(l),q=r2(Math.abs(r-l.theo));await commit('moves',{id:uid(),date:v.date,item:l.item,type:r>l.theo?'E':'S',q,pu:r>l.theo?l.cmup:0,motif:'Écart d\'inventaire '+v.num+' : '+l.just,dep:v.dep,inv:v.id,entryId:'',st:'V'},'écart inventaire',(byId('items',l.item)||{}).nom)}
  v.statut='Validé';v.valid={date:today(),by:ME};await commit('invs',v,'validation inventaire',v.num);invView(id);render();toast('Inventaire validé')}
function invHTML(v){const S=D.settings,s=invStats(v);return `<div class="doc rap"><div class="hd"><div><h1>${esc(S.nom)}</h1><div>${esc(S.adresse)}</div></div><div style="text-align:right"><h1>Procès-verbal d'inventaire</h1><div><b>${esc(v.num)}</b> · ${esc(depNom(v.dep))}</div><div>au ${dfr(v.date)} · ${esc(v.statut)}</div></div></div>

/* ---------- 7. Matériel : maintenance préventive et carburant ---------- */
const EQT=['Groupe électrogène','Motopompe','Véhicule','Moto','Machine à coudre','Outillage électrique','Autre'];
function eqU(e){return e.unite==='km'?'km':e.unite==='h'?'h':''}
function gStat(g,e){const t=today(),jr=+g.tousJ?dd(t,addDays(g.lastD||t,+g.tousJ)):null,cr=+g.tousC&&eqU(e)?r2((+g.lastC||0)+(+g.tousC)-(+e.cpt||0)):null;const late=(jr!==null&&jr<0)||(cr!==null&&cr<0),soon=!late&&((jr!==null&&jr<=7)||(cr!==null&&cr<=(+g.tousC)*0.1));return {jr,cr,late,soon,tag:late?['r','En retard']:soon?['y','Bientôt']:['g','À jour']}}
function fuel(e){const fs=live(D.mops).filter(o=>o.eq===e.id&&o.type==='F'&&+o.cpt>0).sort((a,b)=>(+a.cpt)-(+b.cpt));let L=0,U=0;for(let i=1;i<fs.length;i++){const du=(+fs[i].cpt)-(+fs[i-1].cpt);if(du>0){L+=+fs[i].litres;U+=du}}const k=eqU(e)==='km'?100:1;return U>0?{c:r2(L/U*k),u:eqU(e)==='km'?'L/100 km':'L/h',ecart:+e.norme?r2((L/U*k-(+e.norme))/(+e.norme)*100):null}:null}
function eqCost(e,from){return r2(live(D.mops).filter(o=>o.eq===e.id&&(!from||o.date>=from)).reduce((s,o)=>s+(+o.pieces||0)+(+o.mo||0)+(o.type==='F'?r2((+o.litres||0)*(+o.prixL||0)):0),0))}
function materiel(){const es=live(D.equips).sort((a,b)=>a.nom.localeCompare(b.nom)),can=perm('materiel'),y0=EX()+'-01-01';
  let late=0,soon=0;for(const e of es)for(const g of live(D.gammes).filter(g=>g.eq===e.id)){const s=gStat(g,e);if(s.late)late++;else if(s.soon)soon++}
  return `<h2>Matériel et véhicules</h2><div class="kpis"><div class="kpi"><div class="l">Équipements</div><div class="v">${es.length}</div></div><div class="kpi"><div class="l">Entretiens en retard</div><div class="v ${late?'neg':''}">${late}</div></div><div class="kpi"><div class="l">À faire sous 7 jours</div><div class="v">${soon}</div></div><div class="kpi"><div class="l">Coût ${EX()} (entretien et carburant)</div><div class="v">${money(es.reduce((s,e)=>s+eqCost(e,y0),0))}</div></div></div>
  ${can?'<div class="btns"><button class="pr" data-act="eqForm">+ Équipement</button></div>':''}
  ${es.map(e=>{const gs=live(D.gammes).filter(g=>g.eq===e.id).map(g=>gStat(g,e)),fu=fuel(e),w=gs.some(s=>s.late)?['r','Entretien en retard']:gs.some(s=>s.soon)?['y','Entretien bientôt']:['g','À jour'];return `<div class="card" data-act="eqOpen" data-id="${esc(e.id)}" style="cursor:pointer"><div class="top"><b>${esc(e.nom)}</b><span class="tag ${w[0]}">${w[1]}</span></div><div class="small muted">${esc(e.type)}${eqU(e)?' · compteur '+fmtQ(e.cpt||0)+' '+eqU(e)+(e.cptDate?' le '+dfr(e.cptDate):''):''} · ${gs.length} gamme(s) d'entretien${fu?` · consommation ${fmt(fu.c)} ${fu.u}${fu.ecart!==null?` (<span class="${fu.ecart>15?'neg':''}">${fu.ecart>0?'+':''}${Math.round(fu.ecart)} % / norme</span>)`:''}`:''}</div></div>`}).join('')||'<p class="empty">Enregistrez vos équipements (groupe électrogène, motopompe, véhicules, machines à coudre) et leurs entretiens périodiques, par jours ou par heures de marche. L\'app prévient avant chaque échéance et suit la consommation de carburant par rapport à la norme du constructeur.</p>'}`}
function eqForm(id){const e=id?byId('equips',id):{id:'',nom:'',type:'Groupe électrogène',unite:'h',cpt:0,norme:'',act:UI.lastAct||live(D.acts)[0]?.id,ref:''};
  openSheet(`<h2>${id?'Modifier l\'équipement':'Nouvel équipement'}</h2><form id="feq" data-id="${esc(e.id)}"><div class="row2"><label class="f">Nom<input name="nom" value="${esc(e.nom)}" required maxlength="80" placeholder="Groupe 20 kVA"></label><label class="f">Type<select name="type">${EQT.map(x=>`<option ${x===e.type?'selected':''}>${x}</option>`).join('')}</select></label></div>

let VK=null;const VC={};

  const salt=rnd(16),s=JSON.parse(JSON.stringify(D.settings));s.vault={salt:b64e(salt),check:null};const k=await kdf(code,salt);s.vault.check=await aesE(k,enc.encode('mgc-coffre'));await commitSettings(s,'création du coffre confidentiel','');VK=k}

function bpCalc(b){const H=+b.horizon||5,h=b.hyp||{},inv=(b.invest||[]).reduce((s,x)=>s+(+x.mt||0),0),f=b.fin||{},em=+f.emprunt||0,tx=(+f.taux||0)/100,du=Math.max(1,+f.duree||1),cv=(+h.cv||0)/100,ys=[];let crd=em,tr=(+f.apport||0)+em+(+f.subv||0)-inv,bfrP=0;const t0=tr;
  for(let n=1;n<=H;n++){const ca=r2((+h.ca1||0)*Math.pow(1+(+h.g||0)/100,n-1)),cvn=r2(ca*cv),fx=r2((+h.fixes||0)*Math.pow(1+(+h.inf||0)/100,n-1)),dot=r2((b.invest||[]).reduce((s,x)=>s+(n<=(+x.duree||5)?(+x.mt||0)/(+x.duree||5):0),0)),it=r2(crd*tx),rb=n<=du?r2(em/du):0;crd=r2(crd-rb);
    const ebe=r2(ca-cvn-fx),rai=r2(ebe-dot-it),imp=r2(Math.max(rai*(+h.is||30)/100,ca*(+h.mini||1)/100)),rn=r2(rai-imp),caf=r2(rn+dot),bfr=r2(ca*(+h.bfrj||0)/365),dbfr=r2(bfr-bfrP);bfrP=bfr;tr=r2(tr+caf-rb-dbfr);ys.push({n,ca,cvn,fx,ebe,dot,it,rai,imp,rn,caf,rb,dbfr,tr})}
  const k=(+h.actu||15)/100,fl=ys.map(y=>y.caf-y.dbfr),van=r2(-inv+fl.reduce((s,v,i)=>s+v/Math.pow(1+k,i+1),0));
  const npv=r=>-inv+fl.reduce((s,v,i)=>s+v/Math.pow(1+r,i+1),0);let tri=null;if(inv>0&&npv(0)>0){let lo=0,hi=5;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(npv(m)>0)lo=m;else hi=m}tri=Math.round(lo*1000)/10}
  let cum=-inv,dr=null;for(const [i,v] of fl.entries()){if(cum<0&&cum+v>=0&&v>0)dr=r2(i+(-cum)/v);cum+=v}
  const y1=ys[0]||{},sr=cv<1?r2((+h.fixes||0)/(1-cv)):null;return {ys,inv,van,tri,dr,sr,pm:sr&&y1.ca?Math.round(sr/y1.ca*365):null,t0}}

function programme(d){d=d||today();const L=[],add=(ic,t,v,x)=>L.push({ic,t,v,x});
  for(const x of live(D.tasks).filter(x=>(+x.av||0)<100&&x.debut<=d&&x.fin>=d&&(x.resp===ME||perm('projets'))).sort((a,b)=>a.fin.localeCompare(b.fin))){const p=byId('projects',x.projet)||{};add(x.fin===d?'⏰':'🛠',`${x.nom} — ${p.nom||''}${x.fin===d?' (à terminer aujourd\'hui)':x.debut===d?' (commence aujourd\'hui)':''} · ${+x.av||0} %${x.resp!==ME?' · '+userNom(x.resp):''}`,'projet',{pid:x.projet})}

function monthsUsed(a,end){if(!(+a.duree>0))return 0;const [y0,m0]=a.date.split('-').map(Number),[y1,m1]=end.split('-').map(Number);return Math.max(0,(y1-y0)*12+(m1-m0)+1)}

async function cession(id,F){

async function dotations(yy){
  const y=yy||EX(),end=y+'-12-31';if(locked(end))throw new Error('Exercice clôturé');

  const by={};

  let n=0;for(const act in by){await commit('entries',{id:uid(),date:end,jr:'OD',piece:'DOT-'+y,lib:'Dotations aux amortissements '+y+' — '+actNom(act),act,src:{type:'dotation',ref:y},st:'V',lines:by[act]},'dotations',String(y));n++}

}

const SRV=()=>!DEMO&&D?.settings?.syncUrl&&D.settings.syncKey&&RX.srv.test(D.settings.syncUrl)?{url:D.settings.syncUrl,key:D.settings.syncKey}:null;
const SYNC={err:'',busy:false};let pushT=null;
function schedulePush(){if(!SRV())return;clearTimeout(pushT);pushT=setTimeout(()=>push().catch(e=>{SYNC.err=e.message}),15000)}
async function srvFetch(path,opt={}){const s=SRV();if(!s)throw new Error('Serveur non configuré');if(!LOC.tok)LOC.tok=b64e(rnd(24));

  if(!r.ok){let t='';try{t=(await r.json()).message||''}catch(e){}throw new Error('Serveur '+r.status+(t?' : '+t:''))}return r}
async function push(){
  if(!SRV()||!D||!navigator.onLine||SYNC.busy)return;SYNC.busy=true;
  try{if(!LOC.tok)LOC.tok=b64e(rnd(24));const payload=await packFile('sync',{D:{...D},from:meU().nom,at:NOW()},LOC.pass);
    await srvFetch('mgc_sync?on_conflict=company,device',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({company:D.settings.cr,device:HDR.dev,payload,owner_hash:await sha(LOC.tok),updated_at:new Date().toISOString()})});
    LOC.lastPush=NOW();SYNC.err='';scheduleSave()}

}
async function pull(manual){
  if(!SRV()||!D||!navigator.onLine||SYNC.busy)return;const own=!busy;if(!own&&!manual)return;SYNC.busy=true;if(own)busy=true;let acc=0,rej=0,n=0;
  try{const since=LOC.lastPull||'1970-01-01T00:00:00Z';
    const r=await srvFetch(`mgc_sync?company=eq.${encodeURIComponent(D.settings.cr)}&device=neq.${encodeURIComponent(HDR.dev)}&updated_at=gt.${encodeURIComponent(since)}&select=device,payload,updated_at&order=updated_at.asc`);
    for(const row of await r.json()){n++;try{const {p}=await unpackFile(row.payload,LOC.pass);const rep=await merge(p.D||{},false);acc+=rep.acc;rej+=rep.rej.length}catch(e){rej++}LOC.lastPull=row.updated_at}
    LOC.lastSync=NOW();SYNC.err='';
    if(acc||rej)await audit('synchronisation serveur','*','*',`${n} appareil(s) : ${acc} reçus, ${rej} refusés`);
    scheduleSave();
  }finally{SYNC.busy=false;if(own)busy=false}
  if(acc&&!$('#ov.on'))render();
  if(manual||acc)toast(acc?acc+' élément(s) reçu(s) du serveur'+(rej?', '+rej+' refusé(s)':''):'Déjà à jour');
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('#fm'))mCheck();
  if(t.closest('#fd'))dCalc();
  if(t.closest('#fpo'))poCalc();
  if(t.closest('#fs')){if(t.name==='emp'){const o=t.selectedOptions[0];$('#fs [name=base]').value=o.dataset.b}sCalc()}
  if(t.id==='fq2'){sub.q=t.value;const p=t.selectionStart;render();const n=$('#fq2');n.focus();n.setSelectionRange(p,p)}
  if(t.id==='jq'){sub.jq=t.value;const p=t.selectionStart;render();const n=$('#jq');n.focus();n.setSelectionRange(p,p)}
  if(t.closest('#fq')&&(t.name==='mt'||t.name==='rate'))autoMt2();
  if(t.name==='mt2')t.dataset.typed=t.value?'1':'';
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('select[data-tt]')&&t.value==='__new'){run(async()=>{const nom=(window.prompt(t.dataset.tt==='C'?'Nom du nouveau client':'Nom du nouveau fournisseur')||'').trim();if(nom){const o={id:uid(),type:t.dataset.tt,nom:nom.slice(0,120),tel:'',adresse:'',nif:''};await commit('tiers',o,'nouveau tiers',nom);t.insertAdjacentHTML('afterbegin',`<option value="${esc(o.id)}">${esc(nom)}</option>`);t.value=o.id}else t.value=''});return}
  if(t.id==='qcur'){if($('#qtr'))$('#qtr').innerHTML=optTreso(t.value==='USD'?'5711':'5712',t.value);UI.cur=t.value;saveUI()}
  if(t.closest('#fq')&&['tr','tr2','cur'].includes(t.name))autoMt2();
  if(t.closest('#fd')&&t.name==='cur'){docDraft.cur=t.value;dCalc()}
  if(t.matches('#fcmd [name=client]')&&t.value&&t.value!=='__new'){const last=live(D.cmds).filter(c=>c.client===t.value&&(c.mes||[]).some(Boolean)).sort((a,b)=>b.date.localeCompare(a.date))[0];if(last){MES.forEach((_,i)=>{const el=$('#fcmd [name=m'+i+']');if(el&&!el.value)el.value=last.mes[i]||''});toast('Mesures reprises de la commande '+last.num)}}
  if(t.matches('#pol [name=item]')&&t.value){const tr=t.closest('tr'),it=byId('items',t.value),d=tr.querySelector('[name=des]'),pu=tr.querySelector('[name=pu]');if(!d.value)d.value=it.nom;if(!pu.value){const c=stockOf(it).cmup;if(c)pu.value=r2(c)}poCalc()}
  if(t.dataset.subk&&(t.value||t.type!=='month')){sub[t.dataset.subk]=t.value;render()}
  if(t.id==='pmois'){sub.mois=t.value;render()}
  if(t.id==='jmois'){sub.jmois=t.value;render()}
  if(t.id==='jjr'){sub.jr=t.value;render()}
  if(t.id==='amois'){sub.amois=t.value;render()}
  if(t.id==='glc'){sub.gl=t.value;render()}
  if(t.id==='pact'){sub.pact=t.value;render()}
  if(t.name==='av'&&t.closest('#ftask')){const o=$('#avv');if(o)o.textContent=t.value+' %'}
  if(t.id==='rc'){sub.rc=t.value;sub.pts=new Set();render()}
  if(t.id==='rdate'){sub.rdate=t.value;render()}
  if(t.id==='rsolde'){sub.rsolde=t.value;render()}
